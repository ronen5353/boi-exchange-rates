server {
  listen 8080;
  root /usr/share/nginx/html;

  # Docker's DNS. Resolving per request survives a recreated API container.
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $api http://server:3000;
    proxy_pass $api;
    # Longer than the API's worst case, when both BOI sources time out.
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri /index.html;
  }
}
