name: boi-rates

services:
  db:
    image: postgres:17-alpine
    environment:
      # Local use only; the port is not published.
      POSTGRES_USER: boi
      POSTGRES_PASSWORD: boi
      POSTGRES_DB: boi
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  # Two instances: one works, the other is ready to take over.
  server1: &server
    build: ./server
    hostname: server1
    environment:
      # Time for the gateway to stop sending requests before the server closes.
      SHUTDOWN_DELAY_MS: 3000
      DATABASE_URL: postgres://boi:boi@db:5432/boi
      # Set it in .env to receive alerts.
      ALERT_WEBHOOK_URL:
    # Deliberately not "service_healthy": the API must start without the database.
    depends_on:
      - db
    restart: unless-stopped

  server2:
    <<: *server
    hostname: server2

  client:
    build: ./client
    restart: unless-stopped

  gateway:
    image: haproxy:3.2-alpine
    ports:
      - "8080:8080"
      - "3000:3000"
    volumes:
      - ./gateway:/usr/local/etc/haproxy:ro
    depends_on:
      - server1
      - server2
      - client
    restart: unless-stopped

  # docker compose --profile monitoring up
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring:/etc/prometheus:ro
    restart: unless-stopped

volumes:
  db-data:
