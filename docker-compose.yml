name: boi-rates

services:
  db:
    image: postgres:17-alpine
    environment:
      # Local use only; the port is not published.
      POSTGRES_USER: boi
      POSTGRES_PASSWORD: boi
      POSTGRES_DB: boi
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://boi:boi@db:5432/boi
      # Set it in .env to receive alerts.
      ALERT_WEBHOOK_URL:
    # Deliberately not "service_healthy": the API must start without the database.
    depends_on:
      - db
    ports:
      - "3000:3000"
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "8080:8080"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  # docker compose --profile monitoring up
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring:/etc/prometheus:ro
    restart: unless-stopped

volumes:
  db-data:
