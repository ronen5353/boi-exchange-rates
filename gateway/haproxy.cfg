# The single entry point: the UI on 8080 and the API on 3000.
global
  log stdout format raw local0 notice
  maxconn 2000

defaults
  mode http
  log global
  timeout connect 500ms
  timeout client 30s
  timeout server 30s
  timeout http-request 5s
  timeout queue 5s
  timeout check 500ms
  retries 3
  # A retry goes to the other instance. This is safe because the API only reads and calculates.
  option redispatch 1
  retry-on conn-failure empty-response response-timeout
  default-server check inter 1s fall 2 rise 2 resolvers docker init-addr libc,none resolve-prefer ipv4
  http-error status 503 content-type application/json string '{"error":{"code":"SERVICE_UNAVAILABLE","message":"No server is available"}}'
  http-error status 504 content-type application/json string '{"error":{"code":"GATEWAY_TIMEOUT","message":"The server did not answer in time"}}'

# Containers get a new address when they are recreated.
resolvers docker
  nameserver dns 127.0.0.11:53
  timeout resolve 1s
  timeout retry 1s
  hold valid 2s

frontend main
  bind :8080
  bind :3000
  acl is_ui dst_port 8080
  acl is_api path_beg /api/
  acl is_info path /health /ready /docs
  acl is_docs path_beg /docs/

  # 50 requests per second on average from one address.
  stick-table type ipv6 size 100k expire 1m store http_req_rate(10s)
  http-request track-sc0 src if is_api
  http-request return status 429 content-type application/json string '{"error":{"code":"RATE_LIMITED","message":"Too many requests"}}' hdr retry-after 10 if is_api { sc_http_req_rate(0) gt 500 }

  # Anything else, such as /metrics, is internal.
  http-request return status 404 content-type application/json string '{"error":{"code":"NOT_FOUND","message":"Route not found"}}' if !is_ui !is_api !is_info !is_docs

  use_backend ui if is_ui !is_api
  use_backend ready if { nbsrv(ready) gt 0 }
  # No instance has all the main currencies, but one may still have the currency that is asked for.
  default_backend alive

# One instance works and the other is on standby, not for load but for consistency: two instances
# refresh at different moments, so a customer could otherwise see two rates alternate.
backend ready
  # Short, so that a hung instance is given up quickly. A ready instance answers from memory.
  timeout server 1s
  option httpchk GET /ready
  # The standby is used only once this one is marked down, so the first failed connection does that.
  # Otherwise the retries would all go to a dead instance until the checks notice.
  default-server observe layer4 error-limit 1 on-error mark-down
  server server1 server1:3000
  server server2 server2:3000 backup

backend alive
  # Longer than the API's worst case, when its sources time out during startup.
  timeout server 30s
  option httpchk GET /health
  server server1 server1:3000
  server server2 server2:3000 backup

backend ui
  server client client:8080

# Internal only; the port is not published.
frontend internal
  bind :8405
  http-request use-service prometheus-exporter if { path /metrics }
